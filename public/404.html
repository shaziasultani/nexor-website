
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexor</title>
    <script>
      const base = '/nexor-website'
      const path = window.location.pathname

      const route = path.startsWith(base)
        ? path.slice(base.length)
        : path

      const redirectUrl =
        base +
        '/?redirect=' +
        encodeURIComponent(route + window.location.search + window.location.hash)

      window.location.replace(redirectUrl)
    </script>
  </head>
  <body>
    <p>Redirecting to Nexor...</p>
  </body>
</html>
